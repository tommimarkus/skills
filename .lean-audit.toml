# lean-audit registry for THIS repo. carve_out = intentional parallel structure.
[[carve_out]]                                   # compact catalog restates its own plugin's rubric
a = "{plugin}/skills/*/references/smell-catalog.md"
b = "{plugin}/docs/*-reference/**/*.md"

[[carve_out]]                                   # parallel per-stack extension packs
a = "**/skills/{skill}/**/extensions/**/*.md"
b = "**/skills/{skill}/**/extensions/**/*.md"

[[carve_out]]                                   # parallel per-stack procedures (mutation-*)
a = "**/skills/{skill}/references/procedures/**/*.md"
b = "**/skills/{skill}/references/procedures/**/*.md"

[[carve_out]]                                   # intentionally-shared cross-skill templates
a = "**/references/procedures/project-assimilation.md"
b = "**/references/procedures/project-assimilation.md"
[[carve_out]]
a = "**/references/core-workflow.md"
b = "**/references/core-workflow.md"
[[carve_out]]
a = "**/references/source-grounding.md"
b = "**/references/source-grounding.md"

[[carve_out]]                                   # subagent thin wrappers are intentionally parallel (CLAUDE.md § Subagents)
a = "**/agents/*.md"
b = "**/agents/*.md"

[[carve_out]]                                   # plugin-docs-level compact catalog restates its own plugin's rubric
a = "{plugin}/docs/*-reference/*smell-catalog*.md"
b = "{plugin}/docs/*-reference/**/*.md"

[[carve_out]]                                   # issue-ops/pr-ops provider extensions are deliberately parallel siblings built from the shared provider reference (CLAUDE.md § Subagents-style intentional parallelism)
a = "souroldgeezer-ops/skills/*/extensions/**/*.md"
b = "souroldgeezer-ops/skills/*/extensions/**/*.md"

[[carve_out]]                                   # design-skill extension READMEs are intentionally parallel boilerplate (CLAUDE.md § Subagents-style intentional parallelism)
a = "souroldgeezer-design/skills/*/extensions/README.md"
b = "souroldgeezer-design/skills/*/extensions/README.md"
