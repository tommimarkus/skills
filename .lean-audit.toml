# lean-audit registry for THIS repo. carve_out = intentional parallel structure.

# ip-hygiene accuracy-corpus fixtures are detection test data: the near-verbatim
# pair IS the fixture (expected.jsonl case c5), and the case files are referenced
# by case directory from expected.jsonl / README.md, not by markdown link.
exempt_paths = [
  "souroldgeezer-audit/skills/ip-hygiene/references/evals/accuracy-corpus/**",
]

[[carve_out]]                                   # compact catalog restates its own plugin's rubric
a = "{plugin}/skills/*/references/smell-catalog.md"
b = "{plugin}/docs/*-reference/**/*.md"

[[carve_out]]                                   # parallel per-stack extension packs
a = "**/skills/{skill}/**/extensions/**/*.md"
b = "**/skills/{skill}/**/extensions/**/*.md"

[[carve_out]]                                   # sibling procedures WITHIN one skill are parallel by design: per-stack packs written to one shape (test-quality-audit mutation-dotnet/mutation-nodejs, architecture-design lifting-rules-dotnet/lifting-rules-java), test-quality-audit's per-lane enumeration procedures (mutation-testing, sut-surface-enumeration, auth-matrix-enumeration, migration-upgrade-path) that share the scope/sampling framing, and lean-audit's opt-in lens procedures (minify, platform-redundancy, per-use-cost) that each restate the same opt-in-gate and Disclosure contract. The {skill} capture keeps this inside a single skill; cross-skill procedure pairs are NOT carved out.
a = "**/skills/{skill}/references/procedures/**/*.md"
b = "**/skills/{skill}/references/procedures/**/*.md"

[[carve_out]]                                   # intentionally-shared cross-skill templates
a = "**/references/procedures/project-assimilation.md"
b = "**/references/procedures/project-assimilation.md"
[[carve_out]]
a = "**/references/core-workflow.md"
b = "**/references/core-workflow.md"
[[carve_out]]
a = "**/references/source-grounding.md"
b = "**/references/source-grounding.md"

[[carve_out]]                                   # subagent thin wrappers are intentionally parallel (CLAUDE.md § Subagents)
a = "**/agents/*.md"
b = "**/agents/*.md"

[[carve_out]]                                   # plugin-docs-level compact catalog restates its own plugin's rubric
a = "{plugin}/docs/*-reference/*smell-catalog*.md"
b = "{plugin}/docs/*-reference/**/*.md"

[[carve_out]]                                   # issue-ops/pr-ops provider extensions are deliberately parallel siblings built from the shared provider reference (CLAUDE.md § Subagents-style intentional parallelism)
a = "souroldgeezer-ops/skills/*/extensions/**/*.md"
b = "souroldgeezer-ops/skills/*/extensions/**/*.md"

[[carve_out]]                                   # design-skill extension READMEs are intentionally parallel boilerplate (CLAUDE.md § Subagents-style intentional parallelism)
a = "souroldgeezer-design/skills/*/extensions/README.md"
b = "souroldgeezer-design/skills/*/extensions/README.md"

[[carve_out]]                                   # extension-authoring templates are parallel by design ACROSS plugins; a shared file is impossible here because plugins install independently, so no cross-plugin relative path resolves (the souroldgeezer-ops authoring.md model works only within one plugin)
a = "souroldgeezer-*/skills/*/references/procedures/extension-authoring.md"
b = "souroldgeezer-*/skills/*/extensions/README.md"

[[carve_out]]                                   # CLAUDE.md § Repo-internal skills mandates each internal skill state its own deferred-MCP/ToolSearch tooling order; the depth differs per skill (github-issue-lifecycle adds multi-server disambiguation and gh/REST fallback), so a shared file would bloat one closure or lose precision from the other
a = "internal-skills/*/SKILL.md"
b = "internal-skills/*/SKILL.md"

[[carve_out]]                                   # design pairing procedures are thin citing wrappers over docs/design-reference/architecture-pairing-core.md (the canonical mechanics); the residual per-skill files are parallel by design, like agents/*.md
a = "souroldgeezer-design/skills/*/references/procedures/architecture-pairing.md"
b = "souroldgeezer-design/skills/*/references/procedures/architecture-pairing.md"

[[carve_out]]                                   # a policy SKILL.md is the always-loaded summary of its own core-workflow (summary+depth layering); the invariant recurs by design — policy-posture-core's standing-line rule requires it to be embeddable standalone
a = "souroldgeezer-policy/skills/{skill}/references/core-workflow.md"
b = "souroldgeezer-policy/skills/{skill}/SKILL.md"

[[carve_out]]                                   # policy sibling SKILL.md files share the mandated family scaffolding (Modes/Rules/Ask-vs-continue shape); the shared posture itself is single-sourced in docs/policy-reference/policy-posture-core.md, so the residual parallel is structural, not restated prose
a = "souroldgeezer-policy/skills/*/SKILL.md"
b = "souroldgeezer-policy/skills/*/SKILL.md"
