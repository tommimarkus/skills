[project]
name = "skills-tooling"
version = "0.1.0"
description = "Repo-local tooling for skill architecture reports."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
cache-dir = ".cache/uv"
package = false

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.20",
]

[tool.ruff]
include = [
    "souroldgeezer-audit/skills/lean-audit/references/scripts/**/*.py",
    "souroldgeezer-audit/skills/test-quality-audit/references/scripts/**/*.py",
]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
files = [
    "souroldgeezer-audit/skills/lean-audit/references/scripts",
    "souroldgeezer-audit/skills/test-quality-audit/references/scripts",
]
python_version = "3.11"
strict = true
